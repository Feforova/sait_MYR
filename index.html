<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>МУР</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<script src="config.js"></script>
<style>
/* Layout: заставка на весь экран → вход → клубная лента с мягкой навигацией-таблетками сверху */
:root{
  --bg:#FFF8F5; --paper:#FFFFFF; --cream:#FFF1EA;
  --pink:#F7B5C9; --pink-deep:#E2869F; --peach:#F9C9A8; --dusty:#E6A68E; --sky:#A9D8F2; --sky-deep:#6FB6DE;
  --ink:#5B3A4B; --muted:#9C7F8B; --line:#F4DCE3; --shadow:rgba(226,134,159,.18);
  --accent:#E2869F; --accent-soft:#FBE1E9;
  --f-display:"Rubik","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Nunito",cursive;
  --r:22px; --r-s:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2B1F28; --paper:#36272F; --cream:#3A2A35;
  --pink:#E49AB3; --pink-deep:#F2A6BE; --peach:#E9B391; --dusty:#D99A82; --sky:#8CC6E6; --sky-deep:#9ED3F0;
  --ink:#FBEAF0; --muted:#C9AAB7; --line:#4A3542; --shadow:rgba(0,0,0,.35);
  --accent-soft:#4A2F3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2B1F28; --paper:#36272F; --cream:#3A2A35;
  --pink:#E49AB3; --pink-deep:#F2A6BE; --peach:#E9B391; --dusty:#D99A82; --sky:#8CC6E6; --sky-deep:#9ED3F0;
  --ink:#FBEAF0; --muted:#C9AAB7; --line:#4A3542; --shadow:rgba(0,0,0,.35);
  --accent-soft:#4A2F3D; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#FFE6EE 0%,#FFF4EE 45%,#EAF6FD 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .8s ease, transform .8s ease}
#intro.leaving{opacity:0;transform:scale(1.04);pointer-events:none}
#sky{position:absolute;inset:0;width:100%;height:100%}
.logo-wrap{position:relative;width:min(560px,92vw)}
.logo-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.letter{transform-box:fill-box;transform-origin:50% 90%;animation:pop .9s cubic-bezier(.34,1.7,.5,1) both, sway 4s ease-in-out 1.2s infinite}
.letter:nth-child(2){animation-delay:.18s,1.5s}
.letter:nth-child(3){animation-delay:.36s,1.8s}
@keyframes pop{0%{transform:scale(.2) translateY(60px);opacity:0}100%{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-4px)}}
.girls{position:relative;display:flex;gap:4px;justify-content:center;margin-top:-6px;width:min(420px,88vw)}
.girls svg{width:33%;height:auto;animation:bob 3.2s ease-in-out infinite}
.girls svg:nth-child(2){animation-delay:.4s;transform-origin:bottom}
.girls svg:nth-child(3){animation-delay:.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.intro-sub{position:relative;font-family:var(--f-hand);font-size:clamp(22px,4.5vw,30px);color:#B5647E;margin:2px 0 10px;text-align:center}
.btn-enter{position:relative;border:0;border-radius:999px;padding:16px 34px;font-family:var(--f-display);font-weight:700;font-size:18px;color:#fff;
  background:linear-gradient(135deg,#F59BB8,#F7B79A);box-shadow:0 10px 30px rgba(226,134,159,.45), inset 0 -3px 0 rgba(0,0,0,.08);
  animation:breathe 2.4s ease-in-out infinite}
.btn-enter:hover{filter:brightness(1.05)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ---------- MODAL ---------- */
.veil{position:fixed;inset:0;z-index:60;background:rgba(91,58,75,.28);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.veil{align-items:center}}
.sheet{width:min(460px,100%);background:var(--paper);background-color:var(--bg);border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px var(--shadow);animation:rise .45s cubic-bezier(.3,1.4,.5,1)}
@media (min-width:640px){.sheet{border-radius:28px}}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:24px;text-align:center}
.sheet p.hint{color:var(--muted);text-align:center;margin:6px 0 18px;font-size:14px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who button{border:2px solid transparent;background:var(--cream);border-radius:20px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;transition:transform .2s,border-color .2s}
.who button:hover{transform:translateY(-3px);border-color:var(--pink)}
.who svg{width:64px;height:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:2px solid var(--line);background:var(--paper);background-color:var(--bg);border-radius:var(--r-s);padding:12px 14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--pink)}
textarea.inp{resize:vertical;min-height:70px}
.err{color:#C4506F;font-size:13px;min-height:18px;margin:2px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 6px 16px var(--shadow);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}

/* ---------- APP ---------- */
#app{min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;gap:12px}
.mini-logo{width:92px;flex:none}
.temp{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:700;margin-left:auto;min-width:0}
.temp .dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.temp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;flex:none}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;padding:8px 15px;border-radius:999px;background:var(--cream);position:relative;transition:background .2s}
nav.tabs a[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:0 6px 14px var(--shadow)}
nav.tabs a .ping{position:absolute;top:3px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--sky-deep)}
main{max-width:1100px;margin:0 auto;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-size:clamp(28px,5vw,38px);font-weight:900;letter-spacing:-.5px}
.view-head .sub{font-family:var(--f-hand);font-size:22px;color:var(--pink-deep)}
.card{background:var(--paper);background-color:color-mix(in srgb,var(--bg) 40%,var(--paper));border-radius:var(--r);box-shadow:0 8px 28px var(--shadow);padding:18px}
.panel{background:var(--cream);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:600}
.empty b{display:block;font-family:var(--f-hand);font-size:26px;color:var(--pink-deep);font-weight:700}

.av{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--f-display);font-weight:700;color:#fff;flex:none;overflow:hidden;box-shadow:0 0 0 3px var(--bg)}
.av img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--cream);font-size:13px;font-weight:700}
.chip input{accent-color:var(--accent)}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel label{cursor:pointer}
.chipsel input{position:absolute;opacity:0;pointer-events:none}
.chipsel input:checked + span{background:var(--accent);color:#fff}
.chipsel span{display:inline-block;border-radius:999px;padding:6px 12px;background:var(--cream);font-weight:700;font-size:13px}
.chipsel input:focus-visible + span{outline:3px solid var(--sky-deep)}

/* feed */
.feed-top{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:20px}
@media (min-width:860px){.feed-top{grid-template-columns:1.4fr 1fr}}
.composer .drop{border:2px dashed var(--line);border-radius:var(--r-s);padding:14px;text-align:center;color:var(--muted);font-weight:700;cursor:pointer;display:block}
.composer .drop:hover{border-color:var(--pink)}
.composer .preview{max-height:220px;border-radius:var(--r-s);display:block;margin:0 auto}
.masonry{columns:3 300px;column-gap:16px}
.post{break-inside:avoid;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;animation:fadeup .4s ease both}
@keyframes fadeup{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.post-head{display:flex;align-items:center;gap:10px}
.post-head .who-n{font-weight:800}
.post-media{border-radius:var(--r-s);overflow:hidden;background:var(--cream);min-height:120px}
.post-media img{width:100%;display:block}
.post-cap{white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:0;background:var(--cream);border-radius:999px;padding:4px 10px;font-size:15px;display:inline-flex;gap:4px;align-items:center;transition:transform .2s}
.react b{font-size:12px;font-variant-numeric:tabular-nums}
.react.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--pink)}
.react.boom{animation:boom .5s ease}
@keyframes boom{40%{transform:scale(1.35) rotate(-8deg)}}
.cmts{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.cmt{font-size:14px;overflow-wrap:anywhere}
.cmt b{margin-right:4px}
.cmt-form{display:flex;gap:6px}
.cmt-form .inp{padding:8px 12px;border-radius:999px}
.del{background:none;border:0;color:var(--muted);font-size:12px;margin-left:auto}

/* quiz */
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.daily{display:flex;flex-direction:column;gap:12px}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pick .or{align-self:center;font-family:var(--f-hand);font-size:20px;color:var(--muted)}
.opt{border:0;border-radius:18px;padding:14px 8px;font-weight:800;font-size:16px;background:var(--paper);background-color:var(--bg);box-shadow:0 4px 12px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:76px;transition:transform .2s}
.opt:hover{transform:translateY(-2px)}
.opt.mine{background:linear-gradient(135deg,var(--pink),var(--peach));color:#fff}
.opt .voters{display:flex;gap:2px;min-height:22px}
.match{display:flex;flex-direction:column;gap:10px}
.match-row{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--pink));border-radius:999px;transition:width .6s}
.pct{font-weight:800;font-variant-numeric:tabular-nums;width:46px;text-align:right}
.poll{display:flex;flex-direction:column;gap:8px}
.poll-opt{position:relative;border:0;text-align:left;border-radius:14px;padding:10px 12px;background:var(--paper);background-color:var(--bg);overflow:hidden;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.poll-opt i{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);z-index:0;transition:width .5s}
.poll-opt span{position:relative;z-index:1}
.poll-opt.mine{box-shadow:inset 0 0 0 2px var(--pink)}
.prof-table{overflow-x:auto}
.prof-table table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:520px}
.prof-table th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:4px 10px}
.prof-table td{background:var(--paper);background-color:var(--bg);padding:10px;vertical-align:top;overflow-wrap:anywhere}
.prof-table td:first-child{border-radius:12px 0 0 12px;font-weight:700;color:var(--muted);font-size:13px;width:150px}
.prof-table td:last-child{border-radius:0 12px 12px 0}
.prof-table .same{background:var(--accent-soft)}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.game{border-radius:var(--r);overflow:hidden;background:var(--paper);background-color:color-mix(in srgb,var(--bg) 40%,var(--paper));box-shadow:0 8px 24px var(--shadow);display:flex;flex-direction:column}
.game .art{height:120px;display:grid;place-items:center;position:relative}
.game .art svg{height:86px;width:auto}
.game .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.game h3{font-size:18px}
.soon{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);color:#9C7F8B;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.rooms{display:flex;flex-direction:column;gap:10px}
.room-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.room-row .info{flex:1;min-width:160px}
.players{display:flex}
.players .av{margin-left:-6px}
.stage{display:flex;flex-direction:column;gap:14px}
.canvas-wrap{background:#fff;border-radius:var(--r);box-shadow:0 8px 24px var(--shadow);overflow:hidden;touch-action:none}
.canvas-wrap canvas{display:block;width:100%;aspect-ratio:4/3;cursor:crosshair}
.palette{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.q-big{font-family:var(--f-display);font-size:clamp(20px,4vw,28px);font-weight:700;text-align:center;padding:10px}
.vote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.word{background:var(--paper);background-color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 10px var(--shadow)}
.arrow{color:var(--muted)}

/* plans */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--cream);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.col h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:800}
.task{background:var(--paper);background-color:var(--bg);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 3px 10px var(--shadow)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--pink);flex:none;cursor:pointer;display:grid;place-items:center;transition:all .3s;background:var(--paper)}
.check:checked{background:linear-gradient(135deg,var(--pink),var(--peach));border-color:transparent;box-shadow:0 0 0 4px var(--accent-soft),0 0 18px var(--pink)}
.check:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.mv{border:0;background:var(--cream);border-radius:8px;padding:2px 7px;font-size:12px}
.addtask{display:flex;gap:6px}
.addtask .inp{padding:8px 12px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:640px){.moods{grid-template-columns:repeat(8,1fr)}}
.mood{border:3px solid transparent;border-radius:18px;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:12px;font-weight:800;color:#5B3A4B;transition:transform .2s}
.mood:hover{transform:scale(1.05)}
.mood.on{border-color:var(--ink)}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.today .t{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;color:#5B3A4B;min-height:120px}
.week{overflow-x:auto}
.week table{border-collapse:separate;border-spacing:6px;min-width:440px}
.week td,.week th{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.week td.c{width:44px;height:44px;border-radius:12px;background:var(--line)}
.thermo{height:16px;border-radius:999px;background:linear-gradient(90deg,#BFC7D6,#C9E9FF,#FFD6E0,#FFE3B8);position:relative}
.thermo i{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px var(--shadow);transform:translate(-50%,-50%);border:4px solid var(--pink-deep);transition:left .6s}

/* memories */
.timeline{position:relative;display:flex;flex-direction:column;gap:20px;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--pink),var(--peach),var(--sky))}
.mem{position:relative}
.mem::before{content:"";position:absolute;left:-25px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--paper);background-color:var(--bg);border:3px solid var(--pink-deep)}
.mem .date{font-family:var(--f-hand);font-size:22px;color:var(--pink-deep);font-weight:700}
.mem img{border-radius:var(--r-s);max-height:360px;width:auto;max-width:100%;display:block;margin-top:8px}

/* ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.idea{display:flex;flex-direction:column;gap:10px}
.idea .txt{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.vote{border:0;border-radius:999px;padding:6px 12px;background:var(--cream);font-weight:800;display:inline-flex;gap:6px;align-items:center}
.vote.on{background:linear-gradient(135deg,var(--pink),var(--peach));color:#fff}

/* profile */
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}

/* toasts */
#toasts{position:fixed;z-index:70;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.toast{background:var(--paper);background-color:var(--bg);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px var(--shadow);display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;animation:rise .4s ease;border:2px solid var(--line)}
.banner{background:var(--accent-soft);border-radius:var(--r-s);padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:16px}


/* films */
.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}

.film{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.film-cover{position:relative;border-radius:var(--r-s);overflow:hidden;aspect-ratio:2/3;background:var(--cream);max-width:100%}
.film-cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-ph{width:100%;height:100%;min-height:120px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:44px;color:#fff;background:linear-gradient(160deg,var(--pink),var(--peach) 60%,var(--sky))}
.avg{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.92);color:#5B3A4B;border-radius:999px;padding:2px 9px;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.film-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.film-body h3{font-size:19px;overflow-wrap:anywhere}
.rec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;flex-wrap:wrap}
.score10{margin-left:auto;background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-size:13px}

.film-desc{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.viewers{display:flex;gap:10px;flex-wrap:wrap}
.vw{display:flex;align-items:center;gap:8px;border:0;background:var(--cream);border-radius:999px;padding:4px 12px 4px 4px;text-align:left;line-height:1.25}

.vw.seen .ring{background:var(--c)}

.vw .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.vw:not(.seen) .ring .av{filter:grayscale(.7);opacity:.6}

.scores span{min-width:34px;text-align:center}

/* Firebase Firestore adapter (used when config.js has firebase keys) */
function firebaseDB(cfg){
  const app=firebase.initializeApp(cfg);const fs=firebase.firestore(app);
  try{fs.settings({ignoreUndefinedProperties:true})}catch(e){}
  const wrap=d=>({id:d.id,exists:d.exists,data:()=>d.data()});
  const missing=()=>{const e=new Error('missing');e.code='invalid_argument';return e};
  const coll=path=>({
    onSnapshot:(next,err)=>fs.collection(path).onSnapshot(s=>next({docs:s.docs.map(wrap)}),err),
    get:async()=>({docs:(await fs.collection(path).get()).docs.map(wrap)}),
    doc:id=>{const r=fs.collection(path).doc(id);return {
      get:async()=>wrap(await r.get()),
      set:v=>r.set(v),
      update:async v=>{const s=await r.get();if(!s.exists)throw missing();return r.set(v,{merge:true})},
      delete:()=>r.delete(),
      acquire:async()=>({acquired:true})}}
  });

    reserve:(id,me)=>fs.runTransaction(async tx=>{const r=fs.collection('wishes').doc(id);const s=await tx.get(r);
      if(!s.exists||s.data().reservedBy)return 'taken';tx.set(r,{reservedBy:me,reservedAt:Date.now()},{merge:true});return 'ok'})};
}

      return ()=>{this.listeners[coll]=this.listeners[coll].filter(f=>f!==cb)}}

    const cur=i>=0?list[i]:null;const nx=fn(cur?{...cur}:null);if(nx===null){if(i>=0)list.splice(i,1)}else if(i>=0)list[i]={...nx,id};else list.push({...nx,id});this._deliver(coll,list)},

  },

function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))a[k]=merge({...a[k]},b[k]);else a[k]=b[k]}return a}
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch{let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return 'x'+(h>>>0).toString(16)}
}

let skyRun=true;
function startSky(){
  const cv=$('#sky'),ctx=cv.getContext('2d');
  const sprites=[...['#F7A8C2','#F9BFD0','#F48FB1','#FFC9D9'].map(c=>toImg(HEART(c))),...['#F7A8C2','#F48FB1','#FFB3C8'].map(c=>toImg(ROOSTER(c)))];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;const parts=[];
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  const n=Math.round(Math.min(46,Math.max(18,W*H/26000)));
  for(let i=0;i<n;i++){const sp=i%3===2?4+Math.floor(Math.random()*3):Math.floor(Math.random()*4);
    parts.push({img:sprites[sp],rooster:sp>=4,x:Math.random()*W,y:Math.random()*H,s:(sp>=4?34:20)+Math.random()*22,vy:-(.15+Math.random()*.35),vx:(Math.random()-.5)*.2,r:Math.random()*6,vr:(Math.random()-.5)*.01,ph:Math.random()*6.28})}
  function frame(t){
    if(!skyRun)return;
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      if(!reduce){p.y+=p.vy;p.x+=p.vx+Math.sin(t/1400+p.ph)*.25;p.r+=p.vr}
      if(p.y<-60){p.y=H+40;p.x=Math.random()*W}
      const tw=.55+.45*Math.sin(t/700+p.ph);
      ctx.save();ctx.globalAlpha=.35+.5*tw;ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.r)*.35);
      const h=p.rooster?p.s*1.5:p.s*.9;ctx.drawImage(p.img,-p.s/2,-h/2,p.s,h);ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function fill(el,html){
  if(!el)return;
  const a=document.activeElement;
  if(a&&el.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!/^(checkbox|radio|file|button|submit|range|color)$/.test(a.type)))){el._pending=html;if(!el._fl){el._fl=true;el.addEventListener('focusout',()=>setTimeout(()=>{if(el._pending!=null&&!el.contains(document.activeElement)){const h=el._pending;el._pending=null;fill(el,h)}}),{})}return}
  el.innerHTML=html;
  $$('[data-draft]',el).forEach(i=>{if(drafts[i.dataset.draft])i.value=drafts[i.dataset.draft]});
  hydrateMedia(el);
}
async function hydrateMedia(el){
  for(const img of $$('img[data-media]',el)){
    const id=img.dataset.media;
    if(media[id]){img.src=media[id];continue}
    try{const r=await Store.get('media',id);if(r&&r.d){media[id]=r.d;img.src=r.d}}catch{}

}

/* ================= IMAGE COMPRESS ================= */
function compress(file,max=1280,limit=190000){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=rej;
    r.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('img'));img.onload=()=>{
      let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
      const cv=document.createElement('canvas');let q=.82,out;
      for(let i=0;i<8;i++){cv.width=Math.round(w*s);cv.height=Math.round(h*s);const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(img,0,0,cv.width,cv.height);
        out=cv.toDataURL('image/jpeg',q);if(out.length<limit)break;if(q>.55)q-=.1;else s*=.8}
      res(out)};img.src=r.result};
    r.readAsDataURL(file);
  });
}

  const j=t.closest('[data-join]');if(j){const r=S.rooms.find(x=>x.id===j.dataset.join);if(!r)return;const pl=r.players||[];
    if(!pl.includes(S.me)){if(pl.length>=10)return;await Store.update('rooms',r.id,{players:[...pl,S.me]})}joinRoomLocal(r.id);return}
  const dr=t.closest('[data-delroom]');if(dr){if(dr.dataset.sure){await Store.del('rooms',dr.dataset.delroom)}else{dr.dataset.sure=1;dr.textContent='точно закрыть?'}return}

  const wv=t.closest('[data-whovote]');if(wv){await Store.update('rooms',r.id,{st:{votes:{['r'+(r.st?.round||0)]:{[S.me]:wv.dataset.whovote}}}});return}

function joinRoomLocal(id){
  S.room=id;S.joinedAt=Date.now();S.strokes=[];if(S.roomSub)S.roomSub();S.roomSub=null;
  const r=S.rooms.find(x=>x.id===id);
  const g=r?.game;
  if(g==='draw'||!r){S.roomSub=Store.watch('rooms/'+id+'/strokes',docs=>{S.strokes=docs.sort((a,b)=>a.t-b.t);Draw.redraw()})}
  $('#gameArea').dataset.mode='';VIEWS.games.update();
}
function leaveRoomLocal(){S.room=null;if(S.roomSub)S.roomSub();S.roomSub=null;const a=$('#gameArea');if(a){a.dataset.mode='';VIEWS.games.update()}}

const Draw={color:'#F58FB0',size:6,cv:null,
  attach(cv){this.cv=cv;const ctx=cv.getContext('2d');let pts=null;
    const fit=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.width*1.5;this.redraw()};fit();
    new ResizeObserver(fit).observe(cv);
    const pos=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*1000)/1000,Math.round((e.clientY-r.top)/r.height*1000)/1000]};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts=[pos(e)]};
    cv.onpointermove=e=>{if(!pts)return;const p=pos(e);const l=pts[pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<.004)return;pts.push(p);this.line(ctx,[l,p],this.color,this.size)};
    cv.onpointerup=cv.onpointercancel=async()=>{if(!pts)return;const s=pts.length>1?pts:[pts[0],[pts[0][0]+.001,pts[0][1]]];pts=null;
      if(s.length>600)s.length=600;await Store.set('rooms/'+S.room+'/strokes',uid(),{pts:s.flat(),c:this.color,w:this.size,author:S.me,t:Date.now()})};
  },
  line(ctx,pts,c,w){const W=this.cv.width,H=this.cv.height;ctx.strokeStyle=c;ctx.lineWidth=w*W/500;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x*W,y*H):ctx.moveTo(x*W,y*H));ctx.stroke()},
  redraw(){if(!this.cv||!this.cv.isConnected)return;const ctx=this.cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,this.cv.width,this.cv.height);
    for(const s of S.strokes){const p=[];for(let i=0;i<s.pts.length;i+=2)p.push([s.pts[i],s.pts[i+1]]);this.line(ctx,p,s.c,s.w)}}
};
function quizItem(round){
  const pool=[];MEMBERS.forEach(m=>PROFILE_FIELDS.forEach(([k,l])=>{const v=M(m.id).profile[k];if(v)pool.push({m:m.id,l,v})}));
  if(!pool.length)return null;const h=(round*2654435761>>>0)%pool.length;return pool[h];
}
function renderRoom(area,r){
  const g=GAMES.find(x=>x.id===r.game);const pl=r.players||[];const st=r.st||{};const round=st.round||0;
  const head=`<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" data-back>← В лобби</button><h2 style="font-size:22px;flex:1;min-width:0">${esc(r.name||g.name)}</h2><span class="players">${pl.map(p=>av(p,30)).join('')}</span><button class="btn soft sm" data-leave>Выйти из комнаты</button></div>`;
  if(r.game==='draw'){
    if(area.dataset.mode!=='draw:'+r.id){area.dataset.mode='draw:'+r.id;area.innerHTML=head+`<div class="stage"><div class="palette">${['#F58FB0','#F7A07E','#F2C66D','#9ED8B9','#8FCBEA','#B9A3E3','#5B3A4B','#FFFFFF'].map((c,i)=>`<button class="swatch ${c===Draw.color?'on':''}" style="background:${c}" data-color="${c}" aria-label="Цвет ${i+1}"></button>`).join('')}
      <span style="width:12px"></span>${[3,6,14].map(s=>`<button class="btn sm ${s===Draw.size?'':'soft'}" data-size="${s}">${s===3?'тонко':s===6?'средне':'толсто'}</button>`).join('')}<span style="flex:1"></span><button class="btn ghost sm" data-clear>Очистить холст</button></div>
      <div class="canvas-wrap"><canvas id="drawCv" aria-label="Общий холст"></canvas></div><p class="small muted" style="margin:0">Все в комнате видят линии друг друга. Белый цвет работает как ластик.</p></div>`;
      Draw.attach($('#drawCv'));if(!S.roomSub)joinRoomLocal(r.id)}
    else{$('.players',area).innerHTML=pl.map(p=>av(p,30)).join('')}
    return;
  }
  area.dataset.mode='room:'+r.id;
  let body='';
  if(r.game==='who'){
    const q=WHO_Q[round%WHO_Q.length];const votes=st.votes?.['r'+round]||{};const done=pl.length&&pl.every(p=>votes[p]);
    const mine=votes[S.me];
    const tally={};Object.values(votes).forEach(v=>tally[v]=(tally[v]||0)+1);const max=Math.max(0,...Object.values(tally));
    body=`<div class="card stage"><div class="small muted" style="text-align:center">Вопрос ${round+1}</div><div class="q-big">${q}</div>
      <div class="vote-grid">${MEMBERS.map(m=>`<button class="opt ${mine===m.id?'mine':''}" data-whovote="${m.id}">${av(m.id,40)}${m.name}${done?`<span class="small">${tally[m.id]||0} ${plural(tally[m.id]||0,'голос','голоса','голосов')}${tally[m.id]===max&&max?' · это она!':''}</span>`:''}</button>`).join('')}</div>
      <p class="small muted" style="text-align:center;margin:0">${done?'Все проголосовали!':`Проголосовали ${Object.keys(votes).filter(v=>pl.includes(v)).length} из ${pl.length}`}</p>
      <div style="text-align:center"><button class="btn" data-next>${done?'Следующий вопрос':'Пропустить вопрос'}</button></div></div>`;
  }else if(r.game==='chain'){
    const ch=Object.entries(st.chain||{}).sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);
    const last=ch[ch.length-1];
    body=`<div class="card stage"><div class="q-big">${last?`Ассоциация к слову «${esc(last.w)}»?`:'Начни цепочку с любого слова'}</div>
      <form id="chainForm" class="row"><input class="inp" id="chainIn" data-draft="chain" placeholder="Первое, что пришло в голову" style="flex:1;min-width:0" maxlength="40"><button class="btn" type="submit">Добавить</button></form>
      <div class="chain">${ch.map((c,i)=>`${i?'<span class="arrow">→</span>':''}<span class="word" style="box-shadow:inset 0 -3px 0 ${M(c.a).color}">${esc(c.w)}</span>`).join('')||'<span class="muted small">Цепочка пока пустая</span>'}</div></div>`;
  }else if(r.game==='quiz'){
    const it=quizItem(round);
    if(!it){body=`<div class="card empty"><b>Нужны анкеты</b>Заполните «Анкету о себе» во вкладке «Анкеты», и вопросы появятся</div>`}
    else{const gs=st.guess?.['r'+round]||{};const done=pl.length&&pl.every(p=>gs[p]);
      const score={};Object.entries(st.guess||{}).forEach(([rk,o])=>{const ri=+rk.slice(1);const ans=quizItem(ri);if(!ans)return;Object.entries(o).forEach(([p,v])=>{if(v===ans.m)score[p]=(score[p]||0)+1})});
      body=`<div class="card stage"><div class="small muted" style="text-align:center">${esc(it.l)}</div><div class="q-big">«${esc(it.v)}»</div><p style="text-align:center;margin:0;font-weight:700">Чей это ответ?</p>
      <div class="vote-grid">${MEMBERS.map(m=>`<button class="opt ${gs[S.me]===m.id?'mine':''}" data-guess="${m.id}">${av(m.id,40)}${m.name}${done&&it.m===m.id?'<span class="small">правильно!</span>':''}</button>`).join('')}</div>
      <p class="small muted" style="text-align:center;margin:0">${done?'Ответ открыт':'Ответили '+Object.keys(gs).filter(p=>pl.includes(p)).length+' из '+pl.length}</p>
      <div class="row" style="justify-content:center">${pl.map(p=>`<span class="chip">${av(p,20)} ${score[p]||0} ${plural(score[p]||0,'очко','очка','очков')}</span>`).join('')}</div>
      <div style="text-align:center"><button class="btn" data-next>${done?'Дальше':'Пропустить'}</button></div></div>`}
  }
  fill(area,head+body);
}

function figSVG(ex){
  const A=ex.a,B=ex.b,dur=(ex.dur||2.4)+'s';
  const sp=(o)=>o.s||[(o.n[0]+o.p[0])/2,(o.n[1]+o.p[1])/2];
  const segs={
    lf:o=>`M${o.p} L${o.kr} L${o.fr}`, af:o=>`M${o.n} L${o.er} L${o.hr}`,
    tor:o=>`M${o.n} Q${sp(o)} ${o.p}`, ln:o=>`M${o.p} L${o.kl} L${o.fl}`, an:o=>`M${o.n} L${o.el} L${o.hl}`};
  const an=(attr,a,b)=>`<animate attributeName="${attr}" values="${a};${b};${a}" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="${dur}" repeatCount="indefinite"/>`;
  const path=(k,col,w)=>`<path d="${segs[k](A)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round">${an('d',segs[k](A),segs[k](B))}</path>`;
  const dot=(k,r,col)=>`<circle cx="${A[k][0]}" cy="${A[k][1]}" r="${r}" fill="${col}">${an('cx',A[k][0],B[k][0])}${an('cy',A[k][1],B[k][1])}</circle>`;
  return `<svg viewBox="-6 -6 112 104" aria-hidden="true">
    ${ex.mat?'<rect x="0" y="91" width="100" height="4" rx="2" fill="#A9D8F2"/>':'<line x1="2" y1="93" x2="98" y2="93" stroke="#F4C9D6" stroke-width="2" stroke-linecap="round"/>'}
    ${ex.box?'<rect x="12" y="63" width="22" height="29" rx="4" fill="#F9D9C6"/>':''}
    ${path('lf','#F7C6D4',6)}${path('af','#F7C6D4',5)}
    ${ex.db?dot('hr',4,'#F7A9C2'):''}
    ${path('tor','#EE8FAE',8)}${path('ln','#EE8FAE',6.5)}${path('an','#E9799C',5.5)}
    ${ex.db?dot('hl',4.4,'#F27BA3'):''}
    <circle cx="${A.h[0]}" cy="${A.h[1]}" r="6.6" fill="#FCD9C8" stroke="#5A3828" stroke-width="2.4">${an('cx',A.h[0],B.h[0])}${an('cy',A.h[1],B.h[1])}</circle>
  </svg>`;
}

/* --- private measures --- */
function allMyMeasures(){return [...S.measures.filter(m=>m.member===S.me),...S.privMeasures.map(m=>({...m,private:true}))].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.t-b.t)}
function scoreboard(period){
  const now=new Date();let from='0000';
  if(period==='week')from=weekStart(now);
  if(period==='month')from=dkey(new Date(now.getFullYear(),now.getMonth(),1));
  const r={};MEMBERS.forEach(m=>r[m.id]={id:m.id,pts:0,min:0,n:0,reports:0});
  S.acts.filter(a=>(a.date||'')>=from).forEach(a=>{const x=r[a.member];if(!x)return;x.pts+=actPts(a);x.min+=+a.min||0;x.n++});
  S.reports.filter(rp=>(rp.week||'')>=(period==='all'?'0000':period==='week'?from:weekStart(new Date(now.getFullYear(),now.getMonth(),1)))).forEach(rp=>{const x=r[rp.member];if(x){x.pts+=5;x.reports++}});
  return Object.values(r).sort((a,b)=>b.pts-a.pts||b.min-a.min);
}
function streak(id){const days=new Set(S.acts.filter(a=>a.member===id).map(a=>a.date));let n=0;const d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}

};
function chartSVG(pts,unit){
  const W=640,H=220,l=48,r=20,t=18,b=34;const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const x=i=>l+(W-l-r)*(pts.length===1?.5:i/(pts.length-1)), y=v=>t+(H-t-b)*(1-(v-mn)/(mx-mn));
  const ticks=[0,1,2,3].map(i=>mn+(mx-mn)*i/3);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-b} L${l} ${H-b}Z`;
  const fd=d=>new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  const delta=Math.round((pts.at(-1).v-pts[0].v)*10)/10;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="График замеров">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" class="lbl">${(Math.round(v*10)/10).toString().replace('.',',')}</text>`).join('')}
    <path d="${area}" class="area"/><path d="${line}" class="ln"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?6:4}" class="pt ${i===pts.length-1?'last':''}"><title>${fd(p.d)}: ${p.v} ${unit}</title></circle>`).join('')}
    <text x="${l}" y="${H-10}" class="lbl">${fd(pts[0].d)}</text><text x="${W-r}" y="${H-10}" text-anchor="end" class="lbl">${fd(pts.at(-1).d)}</text>
  </svg></div><p class="small" style="margin:6px 0 0"><b>${delta>0?'+':''}${String(delta).replace('.',',')} ${unit}</b> <span class="muted">с первого замера</span></p>`;
}

/* ---- PROFILE ---- */
VIEWS.me={
  mount(el){
    const m=M(S.me);
    el.innerHTML=`<div class="view-head"><div><h1>Мой профиль</h1><div class="sub">${esc(m.name)}</div></div><button class="btn ghost" id="logout">Выйти</button></div>
    <div class="grid2">
      <section class="card"><div class="row" style="margin-bottom:16px"><span id="myAv">${av(S.me,72)}</span><div><b style="font-size:20px">${esc(m.name)}</b><div class="muted small" id="mySt">${esc(m.status)||'статус не задан'}</div></div></div>
        <div class="field"><label for="stIn">Статус</label><div class="row"><input class="inp" id="stIn" maxlength="70" value="${esc(m.status)}" style="flex:1;min-width:0"><button class="btn sm" id="stSave">Сохранить</button></div></div>
        <div class="field"><label>Мой цвет</label><div class="colors" id="myColors">${COLORS.map(c=>`<button style="background:${c}" data-c="${c}" class="${c===m.color?'on':''}" aria-label="Цвет"></button>`).join('')}</div></div>
        <div class="field"><label>Аватар</label><div class="row"><label class="btn soft sm" for="avFile">Загрузить фото<input type="file" id="avFile" accept="image/*" hidden></label>${m.avatar?'<button class="btn ghost sm" id="avDel">Убрать фото</button>':''}</div></div>
        <p class="small muted" id="meMsg"></p></section>
      <section class="card"><h2 style="font-size:20px;margin-bottom:6px">Цвет компании</h2><p class="small muted" style="margin:0 0 12px">Общий акцент сайта. Меняется у всех.</p>
        <div class="colors" id="clubColors">${ACCENTS.map(c=>`<button style="background:${c}" data-a="${c}" class="${c===(S.club.accent||'#E2869F')?'on':''}" aria-label="Акцент"></button>`).join('')}</div>
        <h2 style="font-size:20px;margin:22px 0 10px">Сменить пароль</h2>
        <form id="pwChange"><div class="field"><label for="pOld">Старый пароль</label><input class="inp" type="password" id="pOld" required></div>
        <div class="field"><label for="pNew">Новый пароль</label><input class="inp" type="password" id="pNew" required></div>
        <div class="row" style="justify-content:space-between"><span class="small muted" id="pwMsg"></span><button class="btn sm" type="submit">Сменить</button></div></form></section>
    </div>`;
    const msg=t=>$('#meMsg').textContent=t;
    $('#logout').onclick=()=>{LS.del('mur-me');location.hash='';location.reload()};
    $('#stSave').onclick=async()=>{await Store.update('members',S.me,{status:$('#stIn').value.trim()});msg('Статус сохранён')};
    $('#myColors').onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;await Store.update('members',S.me,{color:b.dataset.c});VIEWS.me.mount(el)};
    $('#clubColors').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;await Store.set('club','main',{accent:b.dataset.a,by:S.me});$$('#clubColors button').forEach(x=>x.classList.toggle('on',x===b))};
    $('#avFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;msg('Сжимаю…');try{const d=await compress(f,256,60000);await Store.update('members',S.me,{avatar:d});VIEWS.me.mount(el)}catch{msg('Не получилось загрузить фото.')}};
    $('#avDel')&&($('#avDel').onclick=async()=>{await Store.update('members',S.me,{avatar:null});VIEWS.me.mount(el)});
    $('#pwChange').onsubmit=async e=>{e.preventDefault();const rec=await Store.get('members',S.me);const ho=await sha('mur:'+S.me+':'+$('#pOld').value);
      if(rec?.pw&&ho!==rec.pw){$('#pwMsg').textContent='Старый пароль не подходит.';return}
      if($('#pNew').value.length<4){$('#pwMsg').textContent='Нужно хотя бы 4 символа.';return}
      await Store.update('members',S.me,{pw:await sha('mur:'+S.me+':'+$('#pNew').value)});$('#pwMsg').textContent='Пароль изменён';e.target.reset()};
  },
  update(){}
};

/* ================= BOOT ================= */
(async function(){
  $('#bigLogo').innerHTML=furLogo('big',true);
  $('#introGirls').innerHTML=MEMBERS.map(m=>girlSVG(m)).join('');
  startSky();
  const ready=Store.init();
  $('#enterBtn').onclick=async()=>{
    $('#enterBtn').textContent='Минутку…';await ready;$('#enterBtn').textContent='Посетить сайт';
    const saved=LS.get('mur-me',null);
    if(saved&&MEMBERS.some(m=>m.id===saved))enterApp(saved);else showWho();
  };
})();
</script>
